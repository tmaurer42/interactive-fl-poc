<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FL POC</title>
  <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/bulma.min.css') }}" />
  <link rel="stylesheet" type="text/css" href="{{ url_for('static',filename='styles/styles.css') }}" />
</head>

<body>
  <script>0</script>
  <div class="container">
    <div class="columns">
      <div class="column is-four-fifths">
        <h1 class="title mt-4">InFL-UX</h1>
        <p class="subtitle">Interactive Federated Learning with enhanced User Experience</p>
      </div>
      <div class="column is-flex is-justify-content-flex-end mt-4">
        <div>
          <a class="icon-text button is-text" href="/admin/tasks/demo_task">
            <span class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
            </span>
            <span>Configuration</span>
          </a>
        </div>
      </div>
    </div>
    <nav class="tabs">
      <ul>
        <li class="{{ 'is-active' if request.path == url_for('index') else '' }}">
          <a href="{{ url_for('index') }}">Home</a>
        </li>
        <li class="{{ 'is-active' if request.path == url_for('train_model_get') else '' }}">
          <a href="{{ url_for('train_model_get') }}">Train Model</a>
        </li>
        <li class="{{ 'is-active' if request.path == url_for('my_dataset_get') else '' }}">
          <a href="{{ url_for('my_dataset_get') }}">My Training Dataset</a>
        </li>
        <li class="{{ 'is-active' if request.path == url_for('test_model_get') else '' }}">
          <a href="{{ url_for('test_model_get') }}">Test Model</a>
        </li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
  </div>
  <script type="module" src="{{ url_for('static',filename='dist/index.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      (document.querySelectorAll('.notification .delete') || []).forEach(($delete) => {
        const $notification = $delete.parentNode;

        $delete.addEventListener('click', () => {
          $notification.classList.add("is-hidden");
        });
      });
    });
  </script>
</body>

</html>
