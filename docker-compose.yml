version: "3.4"

services:
  fl-server:
    image: fl-server
    platform: linux/amd64
    build:
      context: ./fl-server
      dockerfile: Dockerfile
    ports:
      - 5002:5002
  fl-client:
    image: fl-client
    build:
      context: ./fl-client
      dockerfile: Dockerfile
    ports:
      # Multiple clients: 
      # docker compose up --build --scale fl-client=4
      # - 4002-4005:4002
      - 4002:4002
